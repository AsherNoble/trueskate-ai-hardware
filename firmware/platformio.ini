; TrueSkate-AI hardware -- Teensy 4.1 finger controller.
;
; SimpleFOC is pinned to 2.4.0, the version the bring-up sketches were
; verified against via arduino-cli. Do not float this.

[env]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    askuric/Simple FOC@2.4.0

; SIMPLEFOC_TEENSY4_FORCE_CENTER_ALIGNED_3PWM must be a build flag, not a
; #define in the sketch: the sketch's define never reaches the library's
; own .cpp translation units, where the PWM setup actually lives.
build_flags =
    -D SIMPLEFOC_TEENSY4_FORCE_CENTER_ALIGNED_3PWM

monitor_speed = 115200

; The controller firmware.
[env:teensy41]
build_src_filter = +<*>

; Loop-timing benchmark. Same wiring and the same safety rules as the main
; firmware, but it is a measurement tool and is kept out of src/ so it can
; never end up in a controller build.
[env:loop_timing]
build_src_filter = -<*> +<../bench/loop_timing/>
