; TrueSkate-AI hardware -- Teensy 4.1 finger controller.
;
; SimpleFOC is pinned to 2.4.0, the version the bring-up sketches were
; verified against via arduino-cli. Do not float this.

[env]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    askuric/Simple FOC@2.4.0

; SimpleFOC ships its generic PWM implementations as WEAK symbols and the
; MCU-specific ones as strong. Archived (the default), the linker scans
; members in order, generic_mcu.cpp.o sorts first, its weak _configure3PWM
; satisfies the reference, and teensy_mcu.cpp.o is never extracted -- so
; the Teensy driver silently never runs. Linking the objects directly lets
; strong beat weak.
lib_archive = no

; Main-board v1 uses edge-aligned PWM for ALL six axes. Do not enable
; SIMPLEFOC_TEENSY4_FORCE_CENTER_ALIGNED_3PWM: six axes would require
; 18 independent FlexPWM submodules, but only 14 are available.

monitor_speed = 115200

; The controller firmware.
[env:teensy41]
build_src_filter = +<*>

; Loop-timing benchmark. Same wiring and the same safety rules as the main
; firmware, but it is a measurement tool and is kept out of src/ so it can
; never end up in a controller build.
[env:loop_timing]
build_src_filter = -<*> +<../bench/loop_timing/>

; Pin-map probe: 6 x BLDCDriver3PWM on one Teensy 4.1, no motors.
[env:pwm_pinmap]
build_src_filter = -<*> +<../bench/pwm_pinmap/>

; Flick-and-reset test on axis 1: does voltage-mode FOC without current
; sensing track a fast out-and-back? lib_archive = no is inherited from
; [env] and is load-bearing -- without it the Teensy PWM driver is not
; linked at all.
[env:flick_test]
lib_archive = no
build_src_filter = -<*> +<../bench/flick_test/>
