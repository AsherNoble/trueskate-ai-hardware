[project]
name = "trueskate-ai-hardware"
version = "0.1.0"
description = "Host-side hand control layer for TrueSkate-AI: mirrors the WDA touch interface onto a robotic finger."
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trueskate_ai_hardware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
